# Pre-commit hooks configuration
# Install hooks: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Security checks
      - id: detect-private-key
        name: Detect private keys
        description: Prevents committing private keys (SSH, GPG, etc.)

      - id: detect-aws-credentials
        name: Detect AWS credentials
        args: ['--allow-missing-credentials']
        description: Prevents committing AWS credentials

      # File safety checks
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']  # Block files larger than 1MB
        description: Prevents committing large files

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Prevents committing files with merge conflict markers

      # Format checks
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Removes trailing whitespace

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensures files end with a newline

      - id: check-yaml
        name: Check YAML syntax
        description: Validates YAML files

      - id: check-json
        name: Check JSON syntax
        description: Validates JSON files

      - id: check-toml
        name: Check TOML syntax
        description: Validates TOML files (pyproject.toml, etc.)

      - id: check-case-conflict
        name: Check filename case conflicts
        description: Prevents case-insensitive filename conflicts

  # Secret scanning (gitleaks alternative)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json
        description: Scans for secrets, API keys, tokens, and credentials

  # Python-specific hooks (optional, since you have Python code)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: Format Python code (black)
        language_version: python3
        files: \.py$
        description: Auto-formats Python code

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports (isort)
        files: \.py$
        description: Sorts and organizes Python imports
