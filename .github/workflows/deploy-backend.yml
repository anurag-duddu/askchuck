name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:${{ github.sha }} \
            -t us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:latest \
            .
          docker push us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy askchuck-api \
            --image=us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:${{ github.sha }} \
            --platform=managed \
            --region=us-central1 \
            --project=askchuck \
            --update-env-vars="GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},VOYAGE_API_KEY=${{ secrets.VOYAGE_API_KEY }},PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }},PINECONE_ENVIRONMENT=${{ secrets.PINECONE_ENVIRONMENT }},PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }},COHERE_API_KEY=${{ secrets.COHERE_API_KEY }},FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }},LANGCHAIN_TRACING_V2=${{ secrets.LANGCHAIN_TRACING_V2 }},LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }},LANGCHAIN_PROJECT=${{ secrets.LANGCHAIN_PROJECT }},LANGCHAIN_ENDPOINT=${{ secrets.LANGCHAIN_ENDPOINT }},LLAMACLOUD_API_KEY=${{ secrets.LLAMACLOUD_API_KEY }},APP_ENV=${{ secrets.APP_ENV }},DEBUG=${{ secrets.DEBUG }},ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"
