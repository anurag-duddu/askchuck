name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:${{ github.sha }} \
            -t us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:latest \
            .
          docker push us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy askchuck-api \
            --image=us-central1-docker.pkg.dev/askchuck/askchuck-backend/api:${{ github.sha }} \
            --platform=managed \
            --region=us-central1 \
            --project=askchuck \
            --set-secrets="GROQ_API_KEY=GROQ_API_KEY:latest,VOYAGE_API_KEY=VOYAGE_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,COHERE_API_KEY=COHERE_API_KEY:latest,LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest,LLAMACLOUD_API_KEY=LLAMACLOUD_API_KEY:latest" `# pragma: allowlist secret` \
            --update-env-vars="PINECONE_ENVIRONMENT=us-east-1,PINECONE_INDEX_NAME=askchuck,FIREBASE_STORAGE_BUCKET=askchuck.appspot.com,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=askchuck,LANGCHAIN_ENDPOINT=https://api.smith.langchain.com,APP_ENV=production,DEBUG=false,ALLOWED_ORIGINS=https://askchuck.web.app"
