name: Deploy Frontend to Firebase App Hosting

on:
  push:
    branches: [main]
    paths:
      - 'askchuck-frontend/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: askchuck-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd askchuck-frontend
          npm ci

      - name: Build Next.js app
        run: |
          cd askchuck-frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FREE_QUERY_LIMIT: ${{ secrets.NEXT_PUBLIC_FREE_QUERY_LIMIT }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASKCHUCK }}
          channelId: live
          projectId: askchuck
          # Pinned to the firebase-tools release that was current at the last
          # successful deploy (Feb 2026). With `latest` (15.34.1 in Oct 2026) the
          # deploy fails with 403 on serviceusage.services.get, which the deploy
          # service account (github-firebase-askchuck) doesn't have. Unpin once that
          # account has roles/serviceusage.serviceUsageConsumer.
          firebaseToolsVersion: 15.8.0
