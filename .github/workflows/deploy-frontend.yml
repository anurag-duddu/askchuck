name: Deploy Frontend to Firebase App Hosting

on:
  push:
    branches: [main]
    paths:
      - 'askchuck-frontend/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: askchuck-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd askchuck-frontend
          npm ci

      - name: Build Next.js app
        run: |
          cd askchuck-frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASKCHUCK }}
          channelId: live
          projectId: askchuck
